[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "journalport"
dynamic = ["version"]
description = "Provenance-aware, verifiable, content-preserving journal transfer infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "JournalPort contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["jsonschema[format]>=4.23,<5", "lxml>=5,<7", "pypdf>=5,<7"]

[project.urls]
Homepage = "https://github.com/Sungden/JournalPort"
Repository = "https://github.com/Sungden/JournalPort"
Issues = "https://github.com/Sungden/JournalPort/issues"
Documentation = "https://github.com/Sungden/JournalPort/tree/master/docs"

[project.scripts]
journalport = "journalport.cli:main"

[project.optional-dependencies]
agent = []
rewrite = ["python-docx>=1.1,<2", "pypandoc_binary>=1.15,<2"]
dev = ["build>=1.2,<2", "mypy>=1.14,<2", "pytest>=8,<10", "ruff>=0.8,<1", "types-jsonschema>=4.23,<5", "types-lxml>=2025"]

[tool.hatch.build.targets.wheel]
packages = ["src/journalport"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "journalport/schemas"
"journal_profiles" = "journalport/data/journal_profiles"
"skills/journal-transfer" = "journalport/data/skills/journal-transfer"
"benchmark/guideline_extraction_results.json" = "journalport/data/benchmark/guideline_extraction_results.json"

[tool.hatch.build.targets.sdist]
exclude = [
  "/docs/audits/REAL_WORLD_VALIDATION_MATRIX.md",
  "/docs/audits/V1_RELEASE_CANDIDATE_READINESS.md",
  "/examples/public-synthetic/*.docx",
  "/examples/public-synthetic/*.json",
  "/examples/public-synthetic/transformed/**",
  "/examples/public-synthetic/submission-package/**",
]
include = [
  "/src",
  "/schemas",
  "/journal_profiles",
  "/skills",
  "/tests",
  "/benchmark",
  "/examples",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/CITATION.cff",
  "/THIRD_PARTY_NOTICES.md",
]

[tool.hatch.version]
path = "src/journalport/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/journalport/profiles", "src/journalport/compliance", "src/journalport/transform", "src/journalport/verify", "src/journalport/package", "src/journalport/guidelines", "src/journalport/agents", "src/journalport/api.py", "src/journalport/cli.py"]
warn_unused_configs = true

